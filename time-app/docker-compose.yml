version: "3"

services:
  frontend:
    build: ./frontend
    volumes:
      - /app/node_modules
      - ./frontend:/app
    restart: always
    ports:
      - "3000:3000"
  api:
    build: ./api
    volumes:
      - /app/node_modules
      - ./api:/app
    restart: always
    ports:
      - "5555:5000"
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: time_db
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
  adminer:
    image: adminer
    restart: always
    ports:
      - "8887:8080"

volumes:
  mysql_data:
