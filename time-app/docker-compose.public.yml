version: "3"

services:
  frontend:
    image: ivancherkas/time-app-frontend-dev
    restart: always
    ports:
      - "3000:3000"
  api:
    image: ivancherkas/time-app-api-dev
    restart: always
    ports:
      - "5555:5000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PORT: "3306"
      MYSQL_PASSWORD: password
      MYSQL_DB: time_db
  mysql:
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: time_db
    restart: always
    volumes:
      - mysql_data_public:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
  adminer:
    image: adminer
    restart: always
    ports:
      - "8887:8080"

volumes:
  mysql_data_public:
